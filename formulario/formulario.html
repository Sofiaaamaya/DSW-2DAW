
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="styles.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <scrit type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</head>
<body>
  <div class="container">
  <form action="procesar.php" method="post">
    <fieldset>
      <legend>Registro de usuario</legend>
      <div class="mb-3 form-field" >
          <label for="fieldText" class="form-label">Nombre</label>
          <input name="nombre" type="text" class="form-control" id="fieldText" placeholder="Nombre..">
          <div id="nombreHelp" class="form-text"> Introduce tu nombre.</div>
      </div>
      <div class="mb-3">
        <label for="edad" class="form-label">Edad</label>
        <input type="number" class="form-control" name="edad" placeholder="Edad..">
        <div id="edadHelp" class="form-text">Introduce tu edad.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" aria-describedby="emailHelp" placeholder="Email..">
        <div id="emailHelp" class="form-text">Introduce tu Email.</div>
      </div>
      <input class="btn-solid theme-primary" type="submit" value="Enviar" />

    </fieldset>
  </form>
  </div>
</body>
</html>
